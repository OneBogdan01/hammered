<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
                background-color: #222;
            }
            canvas {
                border: 0px none;
                outline: none;
                background-color: black;
                width: 100%;
                height: 100%;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            .overlay {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 1;
                font-size: 30px;
                color: white;
                background-color: black;
            }
        </style>
    </head>
    <body>
        <div class="overlay" id="overlay-text">Loading...</div>
        <canvas id="canvas" tabindex="0"></canvas>

        <script type='text/javascript'>
            var Module = {
                canvas: document.getElementById("canvas"),

                setStatus: function(text) {
                    console.log('status:', text);
                    var overlay = document.getElementById("overlay-text");
                    if (overlay) overlay.innerHTML = text;
                },

                onRuntimeInitialized: function() {
                    var overlay = document.getElementById("overlay-text");
                    if (overlay) overlay.style.display = 'none';
                }
            };

            // Re-focus canvas on click (itch.io iframe loses focus)
            document.getElementById("canvas").addEventListener('click', function() {
                this.focus();
            });
        </script>

        <!-- Emscripten injects its script loader here -->
        {{{ SCRIPT }}}
    </body>
</html>
